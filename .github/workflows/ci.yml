name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          check-latest: true

      # the same gates a contributor runs locally: just ci
      - run: just ci
