name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: extractions/setup-just@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          check-latest: true

      - name: Gates
        run: just ci

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # dist + publish: the same recipes a human runs for a manual release,
      # so CI can be bypassed entirely with `just dist TAG && just publish TAG`.
      - name: Build artifacts
        run: just dist "${{ steps.tag.outputs.tag }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: just publish "${{ steps.tag.outputs.tag }}"
